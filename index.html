<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Initiative Dashboard</title>
    
    <!-- External Libraries (CDNs) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Processing Data...</div>
    </div>

    <!-- Error Toast -->
    <div class="error-container" id="errorToast"></div>

    <header>
        <div class="logo-area">
            <h1>CS Initiative Dashboard</h1>
            <span id="dataStatus">Waiting for data...</span>
        </div>
        <div class="controls-area">
            <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">
                ↻ Upload Excel
            </button>
            <input type="file" id="fileInput" accept=".xlsx, .xls" onchange="handleFileUpload(event)">
        </div>
    </header>

    <nav>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
            <button class="tab-btn" onclick="switchTab('prebooking')">Prebooking</button>
            <button class="tab-btn" onclick="switchTab('cancellations')">Cancellations</button>
            <button class="tab-btn" onclick="switchTab('lotIssues')">Lot Issues</button>
            <button class="tab-btn" onclick="switchTab('shuttleIssues')">Shuttle Issues</button>
            <button class="tab-btn" onclick="switchTab('editExtend')">Edit / Extend</button>
        </div>
    </nav>

    <main>
        <!-- Filters -->
        <div class="filter-bar">
            <div class="filter-group">
                <label for="monthFilter">Month</label>
                <select id="monthFilter" onchange="updateDashboard()">
                    <option value="All">All Months</option>
                    <option value="Jan 2026">Jan 2026</option>
                    <option value="Feb 2026">Feb 2026</option>
                    <option value="Mar 2026">Mar 2026</option>
                    <option value="Apr 2026">Apr 2026</option>
                    <option value="May 2026">May 2026</option>
                    <option value="Jun 2026">Jun 2026</option>
                    <option value="Jul 2026">Jul 2026</option>
                    <option value="Aug 2026">Aug 2026</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="verticalFilter">Vertical</label>
                <select id="verticalFilter" onchange="updateDashboard()">
                    <option value="All">All</option>
                    <option value="Airport Parking">Airport Parking</option>
                    <option value="City Parking">City Parking</option>
                </select>
            </div>
            <div class="last-updated" id="lastUpdated">Last Updated: Never</div>
        </div>

        <!-- OVERVIEW TAB -->
        <section id="overview" class="dashboard-section active">
            <div class="kpi-grid" id="overview-kpis">
                <!-- KPIs injected by JS -->
            </div>
            
            <div class="content-grid">
                <div class="card">
                    <h3>Monthly Trends: Tickets vs Interactions</h3>
                    <div class="chart-container">
                        <canvas id="overviewChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3>AI Insights</h3>
                    <div id="overview-insights"></div>
                    <h3 style="margin-top:1.5rem;">Oct/Nov Projections</h3>
                    <div id="overview-projections"></div>
                </div>
            </div>
        </section>

        <!-- INITIATIVE TAB TEMPLATE -->
        <section id="initiative-container" class="dashboard-section">
            <div class="kpi-grid" id="initiative-kpis"></div>
            
            <div class="content-grid">
                <div class="card">
                    <h3>Monthly Performance & Projections</h3>
                    <div class="chart-container">
                        <canvas id="initiativeChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3>Top 5 Parking Lots</h3>
                    <div id="top-lots-table"></div>
                </div>
            </div>

            <div class="content-grid">
                <div class="card">
                    <h3>AI Insights</h3>
                    <div id="initiative-insights"></div>
                </div>
                <div class="card">
                    <h3>Projected Performance (Oct/Nov)</h3>
                    <div id="initiative-projections"></div>
                </div>
            </div>
        </section>

        <!-- Diagnostics -->
        <div class="diagnostics-toggle" onclick="toggleDiagnostics()">Show Data Diagnostics</div>
        <div class="diagnostics-panel" id="diagnosticsPanel"></div>
    </main>

    <!-- Link to your JS file at the bottom -->
    <script src="assets/js/app.js"></script>
</body>
</html>
