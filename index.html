<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Initiative Dashboard</title>
    
    <!-- External Libraries (CDNs) -->
    <!-- SheetJS for Excel Processing -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <!-- Chart.js for Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* CSS VARIABLES & RESET */
        :root {
            --primary: #0056b3;
            --secondary: #004494;
            --accent: #00a8cc;
            --bg-light: #f4f7f6;
            --white: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --border: #e0e0e0;
            --success: #28a745;
            --danger: #dc3545;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; }

        /* HEADER */
        header { background: var(--white); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
        .logo-area h1 { font-size: 1.5rem; color: var(--primary); font-weight: 600; }
        .logo-area span { font-size: 0.9rem; color: var(--text-light); margin-left: 10px; }
        
        .controls-area { display: flex; gap: 15px; align-items: center; }
        
        /* BUTTONS */
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 500; transition: all 0.2s; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--secondary); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: rgba(0,86,179,0.05); }
        input[type="file"] { display: none; }

        /* NAVIGATION & TABS */
        nav { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 2rem; overflow-x: auto; }
        .tabs { display: flex; gap: 20px; }
        .tab-btn { padding: 1rem 0.5rem; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; color: var(--text-light); font-size: 0.95rem; font-weight: 500; white-space: nowrap; }
        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active { border-bottom-color: var(--primary); color: var(--primary); }

        /* MAIN CONTENT */
        main { flex: 1; padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }

        /* FILTER BAR */
        .filter-bar { display: flex; gap: 15px; margin-bottom: 2rem; flex-wrap: wrap; background: var(--white); padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border); align-items: center; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; min-width: 150px; }
        .filter-group label { font-size: 0.8rem; color: var(--text-light); font-weight: 600; text-transform: uppercase; }
        select, input { padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.9rem; width: 100%; }
        .last-updated { margin-left: auto; font-size: 0.85rem; color: var(--text-light); }

        /* DASHBOARD GRID */
        .dashboard-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .dashboard-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* KPI CARDS */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .kpi-card { background: var(--white); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .kpi-title { font-size: 0.85rem; color: var(--text-light); margin-bottom: 0.5rem; font-weight: 600; }
        .kpi-value { font-size: 1.8rem; font-weight: 700; color: var(--text-dark); }
        .kpi-sub { font-size: 0.8rem; margin-top: 5px; }
        .text-green { color: var(--success); }
        .text-red { color: var(--danger); }

        /* CHARTS & TABLES CONTAINER */
        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        @media (max-width: 1024px) { .content-grid { grid-template-columns: 1fr; } }

        .card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
        .card h3 { font-size: 1.1rem; margin-bottom: 1.5rem; color: var(--primary); border-bottom: 1px solid var(--bg-light); padding-bottom: 0.5rem; }
        
        .chart-container { position: relative; height: 300px; width: 100%; }

        /* TABLES */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
        th { background-color: #f8f9fa; color: var(--text-light); font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        .rank-cell { font-weight: bold; color: var(--primary); }

        /* AI INSIGHTS & PROJECTIONS */
        .insight-box { background: #eef7fe; border-left: 4px solid var(--accent); padding: 1rem; margin-bottom: 1rem; border-radius: 0 4px 4px 0; }
        .insight-item { margin-bottom: 0.8rem; font-size: 0.95rem; line-height: 1.5; }
        .insight-item strong { color: var(--secondary); }

        .projection-badge { display: inline-block; background: #fff3cd; color: #856404; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; border: 1px solid #ffeeba; }

        /* ERROR/TOAST */
        .error-container { display: none; position: fixed; top: 20px; right: 20px; background: var(--danger); color: white; padding: 1rem; border-radius: var(--radius); z-index: 1000; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* DIAGNOSTICS */
        .diagnostics-toggle { cursor: pointer; color: var(--text-light); text-decoration: underline; font-size: 0.8rem; margin-top: 2rem; display: inline-block; }
        .diagnostics-panel { display: none; margin-top: 1rem; padding: 1rem; background: #333; color: #0f0; font-family: monospace; font-size: 0.8rem; border-radius: 4px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Processing Data...</div>
    </div>

    <!-- Error Toast -->
    <div class="error-container" id="errorToast"></div>

    <header>
        <div class="logo-area">
            <h1>Airport Initiative Dashboard</h1>
            <span id="dataStatus">Waiting for data...</span>
        </div>
        <div class="controls-area">
            <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">
                ↻ Upload Excel
            </button>
            <input type="file" id="fileInput" accept=".xlsx, .xls" onchange="handleFileUpload(event)">
        </div>
    </header>

    <nav>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
            <button class="tab-btn" onclick="switchTab('prebooking')">Prebooking</button>
            <button class="tab-btn" onclick="switchTab('cancellations')">Cancellations</button>
            <button class="tab-btn" onclick="switchTab('lotIssues')">Lot Issues</button>
            <button class="tab-btn" onclick="switchTab('shuttleIssues')">Shuttle Issues</button>
            <button class="tab-btn" onclick="switchTab('editExtend')">Edit / Extend</button>
        </div>
    </nav>

    <main>
        <!-- Filters -->
        <div class="filter-bar">
            <div class="filter-group">
                <label for="monthFilter">Month</label>
                <select id="monthFilter" onchange="updateDashboard()">
                    <option value="All">All Months</option>
                    <option value="Jan 2026">Jan 2026</option>
                    <option value="Feb 2026">Feb 2026</option>
                    <option value="Mar 2026">Mar 2026</option>
                    <option value="Apr 2026">Apr 2026</option>
                    <option value="May 2026">May 2026</option>
                    <option value="Jun 2026">Jun 2026</option>
                    <option value="Jul 2026">Jul 2026</option>
                    <option value="Aug 2026">Aug 2026</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="verticalFilter">Vertical</label>
                <select id="verticalFilter" onchange="updateDashboard()">
                    <option value="All">All</option>
                    <option value="Airport Parking">Airport Parking</option>
                    <option value="City Parking">City Parking</option>
                </select>
            </div>
            <div class="last-updated" id="lastUpdated">Last Updated: Never</div>
        </div>

        <!-- OVERVIEW TAB -->
        <section id="overview" class="dashboard-section active">
            <div class="kpi-grid" id="overview-kpis">
                <!-- KPIs injected by JS -->
            </div>
            
            <div class="content-grid">
                <div class="card">
                    <h3>Monthly Trends: Tickets vs Interactions</h3>
                    <div class="chart-container">
                        <canvas id="overviewChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3>AI Insights</h3>
                    <div id="overview-insights"></div>
                    <h3 style="margin-top:1.5rem;">Oct/Nov Projections</h3>
                    <div id="overview-projections"></div>
                </div>
            </div>
        </section>

        <!-- INITIATIVE TAB TEMPLATE -->
        <section id="initiative-container" class="dashboard-section">
            <div class="kpi-grid" id="initiative-kpis"></div>
            
            <div class="content-grid">
                <div class="card">
                    <h3>Monthly Performance & Projections</h3>
                    <div class="chart-container">
                        <canvas id="initiativeChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3>Top 5 Parking Lots</h3>
                    <div id="top-lots-table"></div>
                </div>
            </div>

            <div class="content-grid">
                <div class="card">
                    <h3>AI Insights</h3>
                    <div id="initiative-insights"></div>
                </div>
                <div class="card">
                    <h3>Projected Performance (Oct/Nov)</h3>
                    <div id="initiative-projections"></div>
                </div>
            </div>
        </section>

        <!-- Diagnostics -->
        <div class="diagnostics-toggle" onclick="toggleDiagnostics()">Show Data Diagnostics</div>
        <div class="diagnostics-panel" id="diagnosticsPanel"></div>
    </main>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            requiredSheets: ['Raw', 'Lot Issue - Moved', 'Shuttle Issue', 'Cancellation - Cross sell', 'Prebooking - Cross sell', 'Edit Extend'],
            interactionTypes: ['Call', 'Chat', 'Email'],
            months: ['Jan 2026', 'Feb 2026', 'Mar 2026', 'Apr 2026', 'May 2026', 'Jun 2026', 'Jul 2026', 'Aug 2026'],
            projectionFactors: {
                'Oct 2026': 1.05, // Assumption: Halloween/Seasonality
                'Nov 2026': 1.15  // Assumption: Thanksgiving Peak
            },
            verticalMap: {
                'Parking': {
                    'Airport': 'Airport Parking',
                    'City': 'City Parking'
                },
                'General': 'Airport Parking'
            }
        };

        // --- STATE MANAGEMENT ---
        let state = {
            raw: [],
            initiatives: {
                overview: [],
                prebooking: [],
                cancellations: [],
                lotIssues: [],
                shuttleIssues: [],
                editExtend: []
            },
            normalized: {
                ticketMap: new Map(), 
                months: []
            },
            currentTab: 'overview',
            charts: {} 
        };

        // --- FILE HANDLING ---
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            showLoading(true);
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    
                    if (validateWorkbook(workbook)) {
                        processData(workbook);
                        document.getElementById('lastUpdated').innerText = `Last Updated: ${new Date().toLocaleTimeString()}`;
                        document.getElementById('dataStatus').innerText = "Data Loaded Successfully";
                        showToast("Data processed successfully!", "success");
                    }
                } catch (err) {
                    console.error(err);
                    showError("We couldn't process this workbook. " + err.message);
                } finally {
                    showLoading(false);
                    event.target.value = '';
                }
            };
            
            reader.readAsArrayBuffer(file);
        }

        function validateWorkbook(workbook) {
            const missing = CONFIG.requiredSheets.filter(s => !workbook.SheetNames.includes(s));
            if (missing.length > 0) {
                throw new Error(`The uploaded workbook is missing the following sheet(s): ${missing.join(', ')}`);
            }
            return true;
        }

        // --- DATA PROCESSING CORE ---
        function processData(workbook) {
            // 1. Parse Sheets to JSON
            state.raw = XLSX.utils.sheet_to_json(workbook.Sheets['Raw'], { defval: "" });
            state.initiatives.prebooking = XLSX.utils.sheet_to_json(workbook.Sheets['Prebooking - Cross sell'], { defval: "" });
            state.initiatives.cancellations = XLSX.utils.sheet_to_json(workbook.Sheets['Cancellation - Cross sell'], { defval: "" });
            state.initiatives.lotIssues = XLSX.utils.sheet_to_json(workbook.Sheets['Lot Issue - Moved'], { defval: "" });
            state.initiatives.shuttleIssues = XLSX.utils.sheet_to_json(workbook.Sheets['Shuttle Issue'], { defval: "" });
            state.initiatives.editExtend = XLSX.utils.sheet_to_json(workbook.Sheets['Edit Extend'], { defval: "" });

            // 2. Build Normalized Data Model
            buildDataModel();

            // 3. Render Dashboard
            updateDashboard();

            // 4. Diagnostics
            renderDiagnostics();
        }

        function buildDataModel() {
            state.normalized.ticketMap.clear();
            
            const getVertical = (row) => {
                const v = row['Vertical'];
                const sv = row['SubVertical'] || "";
                if (v === 'General') return 'Airport Parking';
                if (v === 'Parking') {
                    if (sv.toLowerCase().includes('airport')) return 'Airport Parking';
                    if (sv.toLowerCase().includes('city')) return 'City Parking';
                }
                return null;
            };

            const getMonthLabel = (dateObj) => {
                if (!dateObj) return null;
                const m = dateObj.toLocaleString('default', { month: 'short' });
                const y = dateObj.getFullYear();
                return `${m} ${y}`;
            };

            const classifyInteraction = (val) => {
                if (!val) return 'Other';
                const v = val.toString().toLowerCase();
                if (v.includes('call')) return 'Call';
                if (v.includes('chat')) return 'Chat';
                if (v.includes('email')) return 'Email';
                return 'Other';
            };

            const getOutcome = (row) => {
                const action = (row['Action'] || "").toLowerCase();
                const notes = (row['Notes'] || "").toLowerCase();
                if (action.includes('cancel') || action.includes('refund') || notes.includes('cancel') || notes.includes('refund')) {
                    return 'Lost';
                }
                return 'Saved'; 
            };

            // PROCESS RAW SHEET
            state.raw.forEach(row => {
                const tid = row['Ticket ID'];
                if (!tid) return;

                const vertical = getVertical(row);
                if (!vertical) return; 

                const month = getMonthLabel(row['Ticket_created_date']);
                if (!month || !CONFIG.months.includes(month)) return; 

                if (!state.normalized.ticketMap.has(tid)) {
                    state.normalized.ticketMap.set(tid, {
                        ticketId: tid,
                        vertical: vertical,
                        month: month,
                        interactions: [],
                        amount: 0,
                        outcome: 'Unknown',
                        lotName: row['Lot Name'] || 'Unknown',
                        reason: row['Reason'] || '',
                        subReason: row['Sub Reason'] || ''
                    });
                }

                const ticket = state.normalized.ticketMap.get(tid);
                ticket.interactions.push({
                    type: classifyInteraction(row['Interaction']),
                    date: row['Ticket_created_date']
                });

                if (row['Amount'] && typeof row['Amount'] === 'number') {
                    ticket.amount = row['Amount'];
                }

                ticket.outcome = getOutcome(row);
            });

            // PROCESS INITIATIVE MEMBERSHIP
            const markInitiativeMembers = (data, key) => {
                const ids = new Set();
                data.forEach(r => {
                    if(r['Ticket ID']) ids.add(r['Ticket ID']);
                });
                state.normalized.ticketMap.forEach((ticket, tid) => {
                    if (ids.has(tid)) {
                        ticket.initiatives = ticket.initiatives || [];
                        ticket.initiatives.push(key);
                    }
                });
            };

            markInitiativeMembers(state.initiatives.prebooking, 'prebooking');
            markInitiativeMembers(state.initiatives.cancellations, 'cancellations');
            markInitiativeMembers(state.initiatives.lotIssues, 'lotIssues');
            markInitiativeMembers(state.initiatives.shuttleIssues, 'shuttleIssues');
            markInitiativeMembers(state.initiatives.editExtend, 'editExtend');
        }

        function calculateMetrics(filterMonth, filterVertical, initiativeKey) {
            let tickets = Array.from(state.normalized.ticketMap.values());

            if (filterVertical !== 'All') {
                tickets = tickets.filter(t => t.vertical === filterVertical);
            }

            if (filterMonth !== 'All') {
                tickets = tickets.filter(t => t.month === filterMonth);
            }

            if (initiativeKey !== 'overview') {
                tickets = tickets.filter(t => t.initiatives && t.initiatives.includes(initiativeKey));
            }

            let uniqueTickets = tickets.length; 
            
            let callUnique = new Set();
            let chatUnique = new Set();
            let emailUnique = new Set();
            
            let callInteractions = 0;
            let chatInteractions = 0;
            let emailInteractions = 0;

            let revenueSaved = 0;
            let revenueLost = 0;
            let savedCustomers = 0;
            let lostCustomers = 0;
            let successfulTransfers = 0; 

            const monthlyStats = {};
            CONFIG.months.forEach(m => {
                monthlyStats[m] = { tickets: 0, interactions: 0, saved: 0, lost: 0, revSaved: 0, revLost: 0 };
            });

            const lotStats = {};

            tickets.forEach(t => {
                const interactionTypes = new Set();
                t.interactions.forEach(i => {
                    if (i.type === 'Call') {
                        callInteractions++;
                        callUnique.add(t.ticketId);
                    } else if (i.type === 'Chat') {
                        chatInteractions++;
                        chatUnique.add(t.ticketId);
                    } else if (i.type === 'Email') {
                        emailInteractions++;
                        emailUnique.add(t.ticketId);
                    }
                    interactionTypes.add(i.type);
                });

                if (monthlyStats[t.month]) {
                    monthlyStats[t.month].tickets++;
                    monthlyStats[t.month].interactions += t.interactions.length;
                    
                    let isSaved = false;
                    let isLost = false;

                    if (initiativeKey === 'cancellations') {
                         isLost = (t.outcome === 'Lost');
                         isSaved = !isLost; 
                         if (isLost) revenueLost += t.amount;
                         else revenueSaved += t.amount;

                    } else if (initiativeKey === 'prebooking') {
                        const note = (t.notes || "").toLowerCase();
                        const reason = (t.reason || "").toLowerCase();
                        if (note.includes('transfer') || reason.includes('successful')) {
                            successfulTransfers++;
                        }
                    } else {
                        if (t.outcome === 'Lost') isLost = true;
                        else isSaved = true;

                        if (isLost) revenueLost += t.amount;
                        else revenueSaved += t.amount;
                    }

                    if (isSaved) {
                        savedCustomers++;
                        monthlyStats[t.month].saved++;
                        monthlyStats[t.month].revSaved += t.amount;
                    }
                    if (isLost) {
                        lostCustomers++;
                        monthlyStats[t.month].lost++;
                        monthlyStats[t.month].revLost += t.amount;
                    }
                }

                const lot = t.lotName;
                if (!lotStats[lot]) lotStats[lot] = { count: 0, revSaved: 0, revLost: 0 };
                lotStats[lot].count++;
                lotStats[lot].revSaved += (t.outcome !== 'Lost' ? t.amount : 0);
                lotStats[lot].revLost += (t.outcome === 'Lost' ? t.amount : 0);
            });

            return {
                uniqueTickets,
                callUnique: callUnique.size,
                chatUnique: chatUnique.size,
                emailUnique: emailUnique.size,
                callInteractions,
                chatInteractions,
                emailInteractions,
                totalInteractions: callInteractions + chatInteractions + emailInteractions,
                savedCustomers,
                lostCustomers,
                revenueSaved,
                revenueLost,
                monthlyStats,
                lotStats,
                successfulTransfers
            };
        }

        function renderKPIs(tab, m) {
            const containerId = tab === 'overview' ? 'overview-kpis' : 'initiative-kpis';
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const createCard = (title, value, sub = '', isGreen = null) => {
                let colorClass = '';
                if (isGreen === true) colorClass = 'text-green';
                if (isGreen === false) colorClass = 'text-red';
                
                return `
                    <div class="kpi-card">
                        <div class="kpi-title">${title}</div>
                        <div class="kpi-value ${colorClass}">${value.toLocaleString()}</div>
                        <div class="kpi-sub">${sub}</div>
                    </div>
                `;
            };

            let html = createCard('Total Unique Tickets', m.uniqueTickets);
            html += createCard('Call Unique Tickets', m.callUnique, `${m.callInteractions} Total Interactions`);
            html += createCard('Chat Unique Tickets', m.chatUnique, `${m.chatInteractions} Total Interactions`);
            html += createCard('Email Unique Tickets', m.emailUnique, `${m.emailInteractions} Total Interactions`);

            if (tab !== 'overview') {
                html += createCard('Saved Customers', m.savedCustomers);
                html += createCard('Lost/Refunded Customers', m.lostCustomers);
                html += createCard('Revenue Saved', '$' + m.revenueSaved.toLocaleString(), '', true);
                html += createCard('Revenue Lost', '$' + m.revenueLost.toLocaleString(), '', false);
                
                const total = m.savedCustomers + m.lostCustomers;
                const rate = total > 0 ? ((m.savedCustomers / total) * 100).toFixed(1) + '%' : 'N/A';
                html += createCard('Save/Recovery Rate', rate);
            } else {
                 html += createCard('Total Qualifying Interactions', m.totalInteractions);
            }

            container.innerHTML = html;
        }

        function renderCharts(tab, metrics) {
            const canvasId = tab === 'overview' ? 'overviewChart' : 'initiativeChart';
            const ctx = document.getElementById(canvasId).getContext('2d');

            if (state.charts[canvasId]) {
                state.charts[canvasId].destroy();
            }

            const labels = CONFIG.months;
            
            const last3 = CONFIG.months.slice(-3);
            const avgTickets = last3.reduce((sum, m) => sum + (metrics.monthlyStats[m]?.tickets || 0), 0) / 3;
            const avgSaved = last3.reduce((sum, m) => sum + (metrics.monthlyStats[m]?.saved || 0), 0) / 3;
            
            const projOct = avgTickets * CONFIG.projectionFactors['Oct 2026'];
            const projNov = avgTickets * CONFIG.projectionFactors['Nov 2026'];

            const projSavedOct = avgSaved * CONFIG.projectionFactors['Oct 2026'];
            const projSavedNov = avgSaved * CONFIG.projectionFactors['Nov 2026'];

            const chartLabels = [...labels, 'Oct 2026 (Proj)', 'Nov 2026 (Proj)'];

            let datasets = [];

            if (tab === 'overview') {
                const ticketData = labels.map(m => metrics.monthlyStats[m]?.tickets || 0);
                const interactData = labels.map(m => metrics.monthlyStats[m]?.interactions || 0);
                
                datasets = [
                    {
                        label: 'Unique Tickets',
                        data: [...ticketData, projOct, projNov],
                        backgroundColor: 'rgba(0, 86, 179, 0.7)',
                        borderColor: 'rgba(0, 86, 179, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Total Interactions',
                        data: [...interactData, projOct * 1.5, projNov * 1.5], 
                        type: 'line',
                        borderColor: '#00a8cc',
                        tension: 0.3,
                        borderDash: [5, 5] 
                    }
                ];
                
                datasets[1].segment = {
                    borderDash: ctx => ctx.p0DataIndex >= 8 ? [6, 6] : undefined,
                };

            } else {
                const savedData = labels.map(m => metrics.monthlyStats[m]?.saved || 0);
                const lostData = labels.map(m => metrics.monthlyStats[m]?.lost || 0);

                datasets = [
                    {
                        label: 'Saved Customers',
                        data: [...savedData, projSavedOct, projSavedNov],
                        backgroundColor: 'rgba(40, 167, 69, 0.7)',
                        stack: 'Stack 0',
                    },
                    {
                        label: 'Lost Customers',
                        data: [...lostData, 0, 0], 
                        backgroundColor: 'rgba(220, 53, 69, 0.7)',
                        stack: 'Stack 0',
                    }
                ];
            }

            state.charts[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartLabels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                        }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function renderTopLots(tab, metrics) {
            const container = document.getElementById('top-lots-table');
            if(!container) return;

            const lots = Object.entries(metrics.lotStats)
                .map(([name, data]) => ({ name, ...data }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 5);

            if (lots.length === 0) {
                container.innerHTML = '<p style="color:#666; font-style:italic;">No data available for current selection.</p>';
                return;
            }

            let html = `<table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Parking Lot</th>
                        <th>Tickets</th>
                        <th>Rev Saved</th>
                        <th>Rev Lost</th>
                    </tr>
                </thead>
                <tbody>`;

            lots.forEach((l, index) => {
                html += `<tr>
                    <td class="rank-cell">#${index + 1}</td>
                    <td>${l.name}</td>
                    <td>${l.count}</td>
                    <td class="text-green">$${l.revSaved.toLocaleString()}</td>
                    <td class="text-red">$${l.revLost.toLocaleString()}</td>
                </tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function renderInsights(tab, metrics) {
            const containerId = tab === 'overview' ? 'overview-insights' : 'initiative-insights';
            const container = document.getElementById(containerId);
            let insights = [];

            if (metrics.uniqueTickets === 0) {
                insights.push("No data available for the selected filters.");
            } else {
                const months = CONFIG.months;
                const current = metrics.monthlyStats[months[months.length-1]]?.tickets || 0;
                const prev = metrics.monthlyStats[months[months.length-2]]?.tickets || 0;
                
                if (prev > 0) {
                    const diff = ((current - prev) / prev) * 100;
                    const trend = diff > 0 ? 'increased' : 'decreased';
                    insights.push(`Volume ${trend} by ${Math.abs(diff).toFixed(1)}% from ${months[months.length-2]} to ${months[months.length-1]}.`);
                }

                const totalInter = metrics.callInteractions + metrics.chatInteractions + metrics.emailInteractions;
                if (totalInter > 0) {
                    const topInter = Math.max(metrics.callInteractions, metrics.chatInteractions, metrics.emailInteractions);
                    let topName = metrics.callInteractions === topInter ? "Calls" : (metrics.chatInteractions === topInter ? "Chats" : "Emails");
                    insights.push(`<strong>${topName}</strong> represent the primary interaction channel for this period.`);
                }

                if (tab !== 'overview') {
                    const net = metrics.revenueSaved - metrics.revenueLost;
                    if (net > 0) insights.push(`Positive revenue impact of <strong>$${net.toLocaleString()}</strong>.`);
                    else insights.push(`Net revenue impact is negative ($${net.toLocaleString()}). Review loss reasons.`);
                }
            }

            container.innerHTML = `<div class="insight-box">
                ${insights.map(i => `<div class="insight-item">• ${i}</div>`).join('')}
            </div>`;
        }

        function renderProjections(tab, metrics) {
            const containerId = tab === 'overview' ? 'overview-projections' : 'initiative-projections';
            const container = document.getElementById(containerId);
            
            const lastMonth = 'Aug 2026';
            const val = metrics.monthlyStats[lastMonth];
            
            let html = `<p style="font-size:0.9rem; margin-bottom:5px;">Based on historical trends (Jan-Aug):</p>`;
            
            if (tab === 'overview') {
                html += `<div><strong>Oct 2026:</strong> <span class="projection-badge">Proj</span> ${Math.round(val.tickets * 1.05).toLocaleString()} Tickets</div>`;
                html += `<div style="margin-top:5px;"><strong>Nov 2026:</strong> <span class="projection-badge">Proj</span> ${Math.round(val.tickets * 1.15).toLocaleString()} Tickets (Holiday Peak)</div>`;
            } else {
                html += `<div><strong>Oct 2026:</strong> <span class="projection-badge">Proj</span> ${Math.round(val.saved * 1.05).toLocaleString()} Saved Customers</div>`;
                html += `<div style="margin-top:5px;"><strong>Nov 2026:</strong> <span class="projection-badge">Proj</span> ${Math.round(val.saved * 1.15).toLocaleString()} Saved Customers</div>`;
            }

            container.innerHTML = html;
        }

        function renderDiagnostics() {
            const panel = document.getElementById('diagnosticsPanel');
            let diag = `
                RAW Records: ${state.raw.length}
                Unique Tickets Parsed: ${state.normalized.ticketMap.size}
                Prebooking Init Rows: ${state.initiatives.prebooking.length}
                Cancellations Init Rows: ${state.initiatives.cancellations.length}
                Lot Issue Init Rows: ${state.initiatives.lotIssues.length}
                Shuttle Issue Init Rows: ${state.initiatives.shuttleIssues.length}
                Edit Extend Init Rows: ${state.initiatives.editExtend.length}
            `;
            panel.innerText = diag;
        }

        function switchTab(tabId) {
            state.currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`button[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.querySelectorAll('.dashboard-section').forEach(s => s.classList.remove('active'));
            
            if (tabId === 'overview') {
                document.getElementById('overview').classList.add('active');
            } else {
                const container = document.getElementById('initiative-container');
                container.classList.add('active');
                document.querySelector('#initiative-container h3').innerText = formatTitle(tabId) + " Performance";
            }

            updateDashboard();
        }

        function formatTitle(str) {
            return str.replace(/([A-Z])/g, ' $1').trim();
        }

        function updateDashboard() {
            if (state.raw.length === 0) return; 
            const month = document.getElementById('monthFilter').value;
            const vertical = document.getElementById('verticalFilter').value;
            const tab = state.currentTab;
            const metrics = calculateMetrics(month, vertical, tab);
            renderKPIs(tab, metrics);
            renderCharts(tab, metrics);
            renderTopLots(tab, metrics);
            renderInsights(tab, metrics);
            renderProjections(tab, metrics);
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function toggleDiagnostics() {
            const p = document.getElementById('diagnosticsPanel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function showToast(msg, type) {
            const el = document.getElementById('errorToast');
            el.innerText = msg;
            el.style.background = type === 'success' ? 'var(--success)' : 'var(--danger)';
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function showError(msg) {
            const el = document.getElementById('errorToast');
            el.innerText = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
