<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Initiative Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>

<div class="container mt-4">

    <h1>CS Initiative Dashboard</h1>

    <p>Customer Success Initiative Performance</p>

    <button class="btn btn-primary">
        Upload Latest Excel
    </button>

    <button class="btn btn-outline-primary">
        Refresh Data
    </button>

    <hr>

    <ul class="nav nav-tabs">

        <li class="nav-item">
            <button class="nav-link active">
                Overview
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link">
                Prebooking
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link">
                Cancellations
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link">
                Lot Issues
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link">
                Shuttle Issues
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link">
                Edit / Extend
            </button>
        </li>

    </ul>

    <input
    type="file"
    id="excelFile"
    accept=".xlsx,.xls"
    style="display:none">

<div id="dashboardContent"></div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SheetJS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<!-- App JS -->
<link rel="stylesheet" href="./assets/css/styles.css">

</body>
</html>
