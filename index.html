<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CS Initiative Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="assets/css/styles.css"
        rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <!-- Header -->

    <header class="dashboard-header">

        <div>
            <h1 class="dashboard-title">
                CS Initiative Dashboard
            </h1>

            <div class="dashboard-subtitle">
                Customer Success Initiative Performance
            </div>
        </div>

        <div class="header-actions">

            <button class="btn btn-primary">
                Upload Latest Excel
            </button>

            <button class="btn btn-outline-primary">
                ↻ Refresh Data
            </button>

        </div>

    </header>

    <!-- Status -->

    <section class="status-bar">

        <div>
            <strong>Data Status:</strong>
            No workbook loaded
        </div>

        <div>
            <strong>Last Updated:</strong>
            —
        </div>

    </section>

    <!-- Filters -->

    <section class="filter-panel">

        <div class="row">

            <div class="col-md-4">
                <label class="form-label">Month</label>

                <select class="form-select">
                    <option>All Months</option>
                    <option>Jan 2026</option>
                    <option>Feb 2026</option>
                    <option>Mar 2026</option>
                    <option>Apr 2026</option>
                    <option>May 2026</option>
                    <option>Jun 2026</option>
                    <option>Jul 2026</option>
                    <option>Aug 2026</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Vertical</label>

                <select class="form-select">
                    <option>All</option>
                    <option>Airport Parking</option>
                    <option>City Parking</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Reason</label>

                <select class="form-select">
                    <option>All Reasons</option>
                </select>
            </div>

        </div>

    </section>

    <!-- Tabs -->

    <ul class="nav nav-tabs dashboard-tabs">

        <li class="nav-item">
            <button class="nav-link active"
                data-bs-toggle="tab"
                data-bs-target="#overview">
                Overview
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#prebooking">
                Prebooking
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#cancellations">
                Cancellations
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#lotissues">
                Lot Issues
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#shuttleissues">
                Shuttle Issues
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#editextend">
                Edit / Extend
            </button>
        </li>

    </ul>

    <div class="tab-content">

        <div class="tab-pane fade show active" id="overview">
            <div id="overviewContent"></div>
        </div>

        <div class="tab-pane fade" id="prebooking">
            <div id="prebookingContent"></div>
        </div>

        <div class="tab-pane fade" id="cancellations">
            <div id="cancellationsContent"></div>
        </div>

        <div class="tab-pane fade" id="lotissues">
            <div id="lotIssuesContent"></div>
        </div>

        <div class="tab-pane fade" id="shuttleissues">
            <div id="shuttleIssuesContent"></div>
        </div>

        <div class="tab-pane fade" id="editextend">
            <div id="editExtendContent"></div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

assets/js/app.jsscript>

</body>
</html>
